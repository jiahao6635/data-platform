server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: sigmob-data-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/data_platform}
    username: ${DATABASE_USERNAME:data_platform}
    password: ${DATABASE_PASSWORD:data_platform}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.26.84.144:9092,10.26.84.142:9092,10.26.84.143:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:data-platform-metadata}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    listener:
      ack-mode: record
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic: ${KAFKA_TOPIC:oss_data}
    quiet-period: ${KAFKA_BATCH_QUIET_PERIOD:PT30S}
  auth:
    enabled: ${FEISHU_AUTH_ENABLED:false}
    client-id: ${FEISHU_APP_ID:}
    client-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:}
    frontend-uri: ${FRONTEND_URI:http://localhost:5173/}
  import-file: ${APP_IMPORT_FILE:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  zone-id: ${APP_ZONE_ID:Asia/Shanghai}

logging:
  level:
    com.sigmob.dataplatform: INFO