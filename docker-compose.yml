services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: data_platform
      POSTGRES_USER: data_platform
      POSTGRES_PASSWORD: data_platform
    ports:
      - "5432:5432"
    volumes:
      - data-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_platform -d data_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/data_platform
      DATABASE_USERNAME: data_platform
      DATABASE_PASSWORD: data_platform
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-10.26.18.72:9092,10.26.18.73:9092,10.26.18.74:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-oss_data}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-data-platform-metadata}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_BATCH_QUIET_PERIOD: ${KAFKA_BATCH_QUIET_PERIOD:-PT30S}
      FEISHU_AUTH_ENABLED: ${FEISHU_AUTH_ENABLED:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://localhost:8088/api/v1/auth/callback}
      FRONTEND_URI: ${FRONTEND_URI:-http://localhost:8088/}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data-platform-postgres:
